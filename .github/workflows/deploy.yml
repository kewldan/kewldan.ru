name: Deploy

# Каждый коммит в main: проверки → сборка образов в GHCR → деплой по SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: Пропустить проверки (только для срочного деплоя)
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/checks.yml

  build:
    name: Образ ${{ matrix.image }}
    needs: checks
    if: ${{ always() && (needs.checks.result == 'success' || inputs.skip_checks) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Образ должен хотя бы запуститься и ответить, иначе до сервера он не доедет.
      - name: Смоук-тест образа
        run: |
          image=ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          if [ "${{ matrix.image }}" = api ]; then
            docker run -d --name smoke -p 8080:8080 -e STATS_REFRESH=0 -e ADMIN_TOKEN=smoke "$image"
            url=http://localhost:8080/api/health
          else
            docker run -d --name smoke -p 3000:3000 -e API_URL=http://127.0.0.1:9 "$image"
            url=http://localhost:3000/
          fi
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors -o /dev/null "$url" \
            || { docker logs smoke; exit 1; }
          docker rm -f smoke

  deploy:
    name: Деплой
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://kewldan.ru' }}
    steps:
      - uses: actions/checkout@v7

      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Логин в GHCR на сервере
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' |
            ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      # Скрипт берётся из этого коммита, а не с сервера: так он не меняется под собой во время git reset.
      - name: Обновить стек
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IMAGE_TAG='${{ github.sha }}' bash -s" < deploy/deploy.sh

      - name: Выйти из GHCR на сервере
        if: always()
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker logout ghcr.io" || true

      - name: Проверка сайта
        run: |
          site='${{ vars.SITE_URL || 'https://kewldan.ru' }}'
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$site/api/health"
          echo
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w 'главная: %{http_code}\n' "$site/"

      # Яндекс и Bing узнают о страницах сразу, а не при следующем обходе.
      # Ключ публичный: он же лежит в apps/web/public/<ключ>.txt.
      - name: IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: a6aae6bb03875e93cb20746482d01e94
        run: |
          site='${{ vars.SITE_URL || 'https://kewldan.ru' }}'
          urls=$(curl -fsS "$site/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -Rsc 'split("\n") | map(select(length > 0))')
          jq -nc --arg host "${site#https://}" --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}' |
            curl -sS -o /dev/null -w 'indexnow: %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
